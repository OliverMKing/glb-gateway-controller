apiVersion: v1
kind: Namespace
metadata:
  name: glb-gateway-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: glb-gateway-controller
  namespace: glb-gateway-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glb-gateway-controller
  namespace: glb-gateway-system
  labels:
    app.kubernetes.io/name: glb-gateway-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glb-gateway-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glb-gateway-controller
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: glb-gateway-controller
      securityContext:
        runAsNonRoot: true
      containers:
      - name: controller
        image: controller:latest
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        ports:
        - name: health
          containerPort: 8081
        - name: metrics
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsUser: 65532
      terminationGracePeriodSeconds: 10
