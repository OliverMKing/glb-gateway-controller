apiVersion: v1
kind: Namespace
metadata:
  name: global-demo
  labels:
    istio.io/dataplane-mode: ambient
    istio.io/use-waypoint: waypoint
---
apiVersion: v1
kind: Service
metadata:
  name: global-demo
  namespace: global-demo
  labels:
    istio.io/global: "true"
    istio.io/ingress-use-waypoint: "true"
spec:
  selector:
    app: global-demo
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: global-demo
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    labels:
      istio.io/global: "true"
  listeners:
  - name: mesh
    protocol: HBONE
    port: 15008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-demo
  namespace: global-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: global-demo
  template:
    metadata:
      labels:
        app: global-demo
    spec:
      containers:
      - name: web
        image: busybox:1.36.1
        command:
        - /bin/sh
        - -c
        args:
        - |
          mkdir -p /www
          printf 'hello from %s\n' "$REGION" > /www/index.html
          exec httpd -f -p 8080 -h /www
        env:
        - name: REGION
          value: unknown
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 2
          failureThreshold: 2
---
apiVersion: placement.kubernetes-fleet.io/v1
kind: ClusterResourcePlacement
metadata:
  name: global-demo-workload
spec:
  resourceSelectors:
  - group: ""
    version: v1
    kind: Namespace
    name: global-demo
    selectionScope: NamespaceWithResourceSelectors
  - group: ""
    version: v1
    kind: Service
    name: global-demo
  - group: apps
    version: v1
    kind: Deployment
    name: global-demo
  - group: gateway.networking.k8s.io
    version: v1
    kind: Gateway
    name: waypoint
  policy:
    placementType: PickFixed
    clusterNames:
    - MEMBER_CLUSTER_EAST
    - MEMBER_CLUSTER_WEST
---
apiVersion: placement.kubernetes-fleet.io/v1alpha1
kind: ResourceOverride
metadata:
  name: global-demo-regions
  namespace: global-demo
spec:
  placement:
    name: global-demo-workload
    scope: Cluster
  resourceSelectors:
  - group: apps
    version: v1
    kind: Deployment
    name: global-demo
  policy:
    overrideRules:
    - clusterSelector:
        clusterSelectorTerms:
        - labelSelector:
            matchLabels:
              kubernetes-fleet.io/member-name: MEMBER_CLUSTER_EAST
      jsonPatchOverrides:
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: REGION_EAST
    - clusterSelector:
        clusterSelectorTerms:
        - labelSelector:
            matchLabels:
              kubernetes-fleet.io/member-name: MEMBER_CLUSTER_WEST
      jsonPatchOverrides:
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: REGION_WEST
