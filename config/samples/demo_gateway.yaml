apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: global-demo
  namespace: global-demo
spec:
  gatewayClassName: global-istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-demo
  namespace: global-demo
spec:
  parentRefs:
  - name: global-demo
  rules:
  - backendRefs:
    - name: global-demo
      port: 80
---
apiVersion: gateway.glb.azure.io/v1alpha1
kind: GlobalGatewayPolicy
metadata:
  name: global-demo
  namespace: global-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: global-demo
  fleet:
    workloadPlacementRef:
      group: placement.kubernetes-fleet.io
      kind: ClusterResourcePlacement
      name: global-demo-workload
  minReadyClusters: 1
  azure:
    subscriptionID: SUBSCRIPTION_ID
    resourceGroup: RESOURCE_GROUP
    location: REGION_GLOBAL
    deletionPolicy: Delete
