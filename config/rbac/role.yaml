  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways/status
  - httproutes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.istio.io
  resources:
  - destinationrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - placement.kubernetes-fleet.io
  resources:
  - clusterresourceplacements
  - resourceplacements
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
