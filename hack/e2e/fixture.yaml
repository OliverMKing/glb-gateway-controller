apiVersion: cluster.kubernetes-fleet.io/v1beta1
kind: MemberCluster
metadata:
  name: east
  annotations:
    gateway.glb.azure.io/aks-resource-id: /subscriptions/test/resourceGroups/test/providers/Microsoft.ContainerService/managedClusters/east
    gateway.glb.azure.io/node-resource-group: MC_test_east_eastus2
    gateway.glb.azure.io/location: eastus2
---
apiVersion: cluster.kubernetes-fleet.io/v1beta1
kind: MemberCluster
metadata:
  name: west
  annotations:
    gateway.glb.azure.io/aks-resource-id: /subscriptions/test/resourceGroups/test/providers/Microsoft.ContainerService/managedClusters/west
    gateway.glb.azure.io/node-resource-group: MC_test_west_westus3
    gateway.glb.azure.io/location: westus3
---
apiVersion: v1
kind: Namespace
metadata:
  name: global-demo
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Service
metadata:
  name: global-demo
  namespace: global-demo
  labels:
    istio.io/global: "true"
spec:
  selector:
    app: global-demo
  ports:
  - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: global-istio
spec:
  controllerName: gateway.glb.azure.io/controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: global-demo
  namespace: global-demo
spec:
  gatewayClassName: global-istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-demo
  namespace: global-demo
spec:
  parentRefs:
  - name: global-demo
  rules:
  - backendRefs:
    - name: global-demo
      port: 80
---
apiVersion: placement.kubernetes-fleet.io/v1
kind: ResourcePlacement
metadata:
  name: global-demo-workload
  namespace: global-demo
spec:
  resourceSelectors:
  - group: ""
    version: v1
    kind: Service
    name: global-demo
  policy:
    placementType: PickFixed
    clusterNames:
    - east
    - west
---
apiVersion: gateway.glb.azure.io/v1alpha1
kind: GlobalGatewayPolicy
metadata:
  name: global-demo
  namespace: global-demo
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: global-demo
  fleet:
    workloadPlacementRef:
      group: placement.kubernetes-fleet.io
      kind: ResourcePlacement
      name: global-demo-workload
  minReadyClusters: 2
  azure:
    subscriptionID: test
    resourceGroup: test
    location: eastus2
